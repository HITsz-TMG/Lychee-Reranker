name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[train,eval,dev]'
      - run: ruff check src tests
      - run: pytest
      - run: python -m build
      - run: python -m lychee_reranker.train.cli --help
      - run: lychee-reranker-eval --help
      - name: Reject private artifacts
        run: |
          private_root='/(mnt|root|home|Users)/'
          key_marker='BE'"GIN PRIVATE KEY"
          token_prefix='s'"k-"
          hub_prefix='h'"f_"
          ! rg -n "$private_root|$key_marker|${token_prefix}[A-Za-z0-9]|${hub_prefix}[A-Za-z0-9]{20,}" .
          test -z "$(find . -type f -size +10M -not -path './.git/*' -print -quit)"

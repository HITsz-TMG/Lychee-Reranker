name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[train,eval,faiss,dev]' -c requirements/repro.txt
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest
      - run: python -m build
      - run: python -m lychee_reranker.train.cli --help
      - run: lychee-reranker-eval --help
      - run: python scripts/check_release.py

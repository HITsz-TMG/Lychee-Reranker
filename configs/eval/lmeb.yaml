benchmark: lmeb
data_dir: data/lmeb
output_dir: results/lmeb-dialogue
split: test
tasks: [ConvoMem, LoCoMo, LongMemEval, MemBench, REALTALK, TMD]
retrieval_top_k: 100
rerank_top_k: 100
metrics: [ndcg@10, ndcg@100, recall@10, recall@100, mrr@10]
embedder:
  model_name_or_path: KaLM-Embedding/KaLM-embedding-multilingual-mini-instruct-v2.5
  max_length: 512
  batch_size: 64
  trust_remote_code: false
reranker:
  model_name_or_path: models/Lychee-Reranker-V1-Nano
  query_max_length: 512
  max_length: 1024
  chunk_size: 4
  batch_size: 32
  trust_remote_code: false

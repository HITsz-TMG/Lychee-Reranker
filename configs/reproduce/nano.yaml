schema_version: 1
size: nano
base_model: google/t5gemma-2-270m-270m
sft_config: configs/train/nano_sft.yaml
sft_adapter: outputs/nano/sft-adapter
sft_merged: outputs/nano/sft-merged
distillation:
- config: configs/train/nano_distill_r64.yaml
  adapter: outputs/nano/kd-r64-adapter
  merged: outputs/nano/kd-r64-merged
- config: configs/train/nano_distill_r96.yaml
  adapter: outputs/nano/kd-r96-adapter
  merged: outputs/nano/kd-r96-merged
model_soup:
  weights:
  - 0.5
  - 0.5
  output: outputs/nano/final
training_contract:
  world_size: 32
  global_query_batch_size: 128
  train_group_size: 16
  mep_ratios:
  - 2
  - 8
  - 32
  - 128
provenance:
  bitwise_reproduction_claimed: false
  note: Nano KD ranks 64/96 and alphas 32/48 match the original KD launchers and
    the paper. This does not establish historical weight or training-data order identity.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lychee-reranker"
version = "1.0.0"
description = "Training, inference, and evaluation code for Lychee-Reranker-V1"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Lychee-Reranker contributors"}]
dependencies = [
  "numpy>=1.26",
  "torch>=2.6",
  "transformers>=5.3.0,<6",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.13.0,<2",
  "datasets>=4.8.4,<5",
  "peft>=0.18.1,<0.19",
  "pyarrow>=23.0.1,<24",
  "PyYAML>=6.0",
]
deepspeed = ["deepspeed>=0.18.8,<0.19"]
eval = ["faiss-cpu>=1.10", "PyYAML>=6.0", "tqdm>=4.66"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.11"]

[project.scripts]
lychee-reranker-train = "lychee_reranker.train.cli:main"
lychee-reranker-merge = "lychee_reranker.checkpoint.merge:main"
lychee-reranker-soup = "lychee_reranker.checkpoint.soup:main"
lychee-reranker-eval = "lychee_reranker.evaluation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
